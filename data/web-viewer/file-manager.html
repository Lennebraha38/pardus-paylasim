<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Pardus Paylaşım — Dosya Yöneticisi</title>
  <link rel="stylesheet" href="/viewer.css">
  <link rel="stylesheet" href="/file-manager.css">
</head>
<body>
  <main aria-label="Uzak Dosya Yöneticisi">
    <h1>Uzak Dosya Yöneticisi</h1>
    
    <section aria-label="Araç Çubuğu">
      <p>Şu anki dizin: <strong id="current-path" aria-live="polite">/ (İndirilenler)</strong></p>
      <button id="btn-up" class="btn btn-secondary" aria-label="Üst Dizine Çık">Üst Dizine Çık</button>
    </section>

    <section aria-label="Dosya Yükleme">
      <h2>Bu Cihaza Dosya Gönder</h2>
      <p>En fazla 100 MB. Yüklenen dosya karşı cihazın İndirilenler klasörüne kaydedilir.</p>
      <input type="file" id="upload-input" aria-label="Yüklenecek dosyayı seç">
      <button id="btn-upload" class="btn" aria-label="Seçili dosyayı yükle">Yükle</button>
      <progress id="upload-progress" value="0" max="100" aria-label="Yükleme ilerlemesi" hidden></progress>
      <p id="upload-status" role="status" aria-live="polite"></p>
    </section>

    <div role="status" aria-live="polite" id="status-message" class="sr-only"></div>

    <section aria-label="Dosya Listesi">
      <div class="file-list" id="file-list" role="list">
        <!-- İçerik JS ile doldurulacak -->
      </div>
    </section>
  </main>
  
  <script src="/file-manager.js"></script>
</body>
</html>
