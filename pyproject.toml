[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pardus-paylasim"
version = "1.1.0"
description = "Pardus Güvenli Paylaşım ve Süreklilik Merkezi"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "Lennebraha38", email = "farukhilmi12345@gmail.com"},
]
keywords = ["pardus", "file-sharing", "screen-share", "privacy", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "cryptography>=41.0",
    "defusedxml>=0.7",
    "filelock>=3.12",
    "Pillow>=10.0",
    "pyperclip>=1.8",
    "qrcode[pil]>=7.4",
    "websockets>=12.0",
    "zeroconf>=0.80",
]

[project.optional-dependencies]
# PyGObject pip ile derlenirken sistem başlıkları gerekir; Pardus/Debian'da
# `apt install python3-gi` tercih edilir. CLI bu extra olmadan da çalışır.
gui = [
    "PyGObject>=3.42",
]
screen = [
    "aiortc>=1.6",
    "av>=12.0",
    "mss>=9.0",
    "numpy>=1.26",
    "soundcard>=0.4.3",
]
input = [
    "pydbus>=0.6",
    "pynput>=1.7",
    "python-xlib>=0.33",
]
agent = [
    "plyer>=2.1",
    "pystray>=0.19",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.2",
]
dev = [
    "build>=1.0",
    "mypy>=1.8",
    "pre-commit>=3.0",
    "ruff>=0.4",
]
full = [
    "pardus-paylasim[gui,screen,input,agent]",
]

[project.scripts]
pardus-paylasim = "pardus_paylasim.app:main"
pardus-paylasim-agent = "pardus_paylasim_agent.agent:main"
pardus-paylasim-server = "pardus_paylasim_server.router:cli"

[project.urls]
Homepage = "https://github.com/Lennebraha38/pardus-paylasim"
Repository = "https://github.com/Lennebraha38/pardus-paylasim"
Issues = "https://github.com/Lennebraha38/pardus-paylasim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pardus_paylasim = ["py.typed", "locale/**/*.mo", "locale/**/*.po"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # function call in default argument (dataclass pattern)
]

[tool.ruff.lint.per-file-ignores]
# Testlerde assert ve sabit /tmp yolları normaldir; üretim kodunda yasaktır.
"tests/**" = ["S101", "S106", "S108", "S310", "S603"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Birim testleri",
    "backend: Saf Python mantık testleri",
    "turing: Metin maskeleme, metadata temizliği vb.",
    "docker: Docker compose gerektirenler",
    "e2e: Gerçek router/network üzerinden yapılanlar",
    "native_windows: Sadece Windows OS'te çalışacaklar",
    "native_pardus: Sadece Pardus/Debian X11 veya Wayland'da çalışacaklar",
    "integration: Entegrasyon testleri",
    "wayland: Wayland kompozitör testleri",
    "x11: X11 kompozitör testleri",
    "network: Ağ ve bağlantı testleri",
    "slow: Uzun süren testler",
    "security: Güvenlik, fuzzing ve payload testleri",
    "accessibility: UI/UX Erişilebilirlik (WCAG) testleri",
]
addopts = "--strict-markers -ra"
