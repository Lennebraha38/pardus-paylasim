[pytest]
addopts = 
    --strict-markers
    -ra
    --import-mode=importlib
markers =
    unit: Birim testleri
    backend: Saf Python mantık testleri
    turing: Metin maskeleme, metadata temizliği vb.
    docker: Docker compose gerektirenler
    e2e: Gerçek router/network üzerinden yapılanlar
    native_windows: Sadece Windows OS'te çalışacaklar
    native_pardus: Sadece Pardus/Debian X11 veya Wayland'da çalışacaklar
    integration: Entegrasyon testleri
    wayland: Wayland kompozitör testleri
    x11: X11 kompozitör testleri
    network: Ağ ve bağlantı testleri
    slow: Uzun süren testler
    security: Güvenlik, fuzzing ve payload testleri
    accessibility: UI/UX Erişilebilirlik (WCAG) testleri
