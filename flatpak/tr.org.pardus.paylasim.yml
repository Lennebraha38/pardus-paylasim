app-id: tr.org.pardus.paylasim
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: pardus-paylasim

finish-args:
  # Display and input
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  # Network (mDNS + P2P transfer)
  - --share=network
  # Audio (screen share audio)
  - --socket=pulseaudio
  # Access home directory for file operations
  - --filesystem=home
  # D-Bus for notifications
  - --talk-name=org.freedesktop.Notifications

# pip bağımlılıkları PyPI'dan çekilir; flatpak-builder varsayılan olarak ağı
# kapatır. Üretim mağaza derlemesinde bağımlılıkları `flatpak-pip-generator`
# ile sabitlenmiş modüllere dönüştürün (bkz. flatpak/README.md).
build-options:
  build-args:
    - --share=network

modules:
  - name: pardus-paylasim
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app .
    sources:
      - type: dir
        path: ..
