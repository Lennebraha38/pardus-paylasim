name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Lint + platform-bagimsiz unit testler (GTK gerektirmez)
  # Matrix: Python 3.10 / 3.11 / 3.12 — Ubuntu runner.
  # -------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Unit (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (test + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff

      - name: Ruff lint
        run: ruff check src tests

      - name: Run platform-independent tests
        run: pytest tests/ -m "not docker and not e2e" -v

  # -------------------------------------------------------------------------
  # Job 2: Debian paket + entegrasyon (docker, Pardus base image)
  # -------------------------------------------------------------------------
  debian-integration:
    name: Debian build & integration
    runs-on: ubuntu-22.04
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build .deb + docker integration
        run: bash tests/run_docker_test.sh

      - name: Upload Debian Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pardus-paylasim-deb
          path: pardus-paylasim_*.deb
          if-no-files-found: error
